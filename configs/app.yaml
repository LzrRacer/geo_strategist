version: 1
project:
  name: geo-strategist
  mode: scaffold
  description: "Reproducible workflow comparison scaffold for location strategy tasks."

paths:
  manual_inputs: ".data/manual"
  api_raw: ".data/api_raw"
  cache: ".cache"
  inventory_cache: ".cache/inventory"
  inspection_cache: ".cache/inspection"
  runs: ".runs"
  references_local: "references/local"
  legacy_manual_inputs: "data/manual"

environment:
  dotenv_file: ".env"
  example_file: ".env.example"
  log_level_env: "GEO_STRATEGIST_LOG_LEVEL"

defaults:
  judge_model_env: "DEFAULT_JUDGE_MODEL"
  openrouter_model_env: "DEFAULT_OPENROUTER_MODEL"
  require_provenance_for_numeric_claims: true
  allow_mock_numeric_data: false
  allow_fake_api_outputs: false

feature_gates:
  api_clients: disabled
  hospital_finance_model: disabled
  geospatial_scoring: disabled
  proposal_generation: disabled
  reviewer_logic: disabled
