version: "1.0"

# Deterministic candidate-action generation configuration.
# Candidate actions are restricted to exactly three values:
#   build, reorganize, consolidate
# No other values are permitted. If evidence is insufficient for any action,
# no candidate is emitted; an issue is recorded instead.

allowed_candidate_actions:
  - build
  - reorganize
  - consolidate

# Input score fields read from municipality_scores_enriched.jsonl
input_score_fields:
  - overall_pre_candidate_priority_score
  - demand_pressure_score
  - population_aging_pressure_score
  - supply_gap_score
  - data_completeness_score
  - land_score
  - healthcare_supply_score
  - bed_supply_pressure_score

# Feature availability conditions checked against municipality_feature_base_enriched.jsonl
required_feature_availability:
  build:
    land_score_available: true
  reorganize:
    healthcare_supply_score_available: true
  consolidate:
    any_real_source_available: true  # land OR healthcare supply must be present

# Threshold rules (config-driven; changing these requires re-run + report update)
thresholds:
  build:
    # High overall priority
    overall_min: 0.50
    # High demand OR high aging pressure required
    demand_min: 0.35
    aging_min: 0.40
    # Meaningful supply pressure required — prefer municipality-level healthcare supply
    # score (Phase 6) over prefecture-level supply_gap_score (Phase 5), since
    # municipality-level data is more accurate for demand planning.
    # Use healthcare_supply_score or bed_supply_pressure_score when available;
    # fall back to supply_gap_score otherwise.
    healthcare_supply_or_bed_min: 0.40
    supply_gap_min_fallback: 0.20
    # Land score must be available (real land data required)
    land_score_available_required: true

  reorganize:
    # Moderate or better overall score
    overall_min: 0.30
    # Some demand or aging pressure required
    demand_or_aging_demand_min: 0.15
    demand_or_aging_aging_min: 0.25
    # Healthcare supply data must be available (required for reorganize evidence)
    healthcare_supply_score_available_required: true
    # Must NOT qualify for build (build takes priority)
    exclude_build_candidates: true

  consolidate:
    # Lower overall priority (declining or low-demand areas)
    overall_max: 0.30
    # Low demand pressure
    demand_max: 0.25
    # Must NOT qualify for build or reorganize
    exclude_build_candidates: true
    exclude_reorganize_candidates: true
    # At least one real data source must be present to avoid speculative consolidation
    any_real_source_available_required: true

# Missing-data behavior
missing_data_policy:
  # If a required score is None (data unavailable), emit issue and skip candidate
  action_on_missing_required_score: skip_and_emit_issue
  issue_code: candidate_action_not_emitted_due_to_insufficient_evidence

# Ranking within each action group
ranking:
  build:
    # Rank by overall score descending; ties broken alphabetically
    sort_by: overall_pre_candidate_priority_score
    sort_order: descending
    tie_break: alphabetical_by_municipality
  reorganize:
    sort_by: overall_pre_candidate_priority_score
    sort_order: descending
    tie_break: alphabetical_by_municipality
  consolidate:
    # Rank by overall score ascending (lowest priority = strongest consolidation case)
    sort_by: overall_pre_candidate_priority_score
    sort_order: ascending
    tie_break: alphabetical_by_municipality

# Maximum candidates per action (null = unlimited)
max_candidates_per_action:
  build: null
  reorganize: null
  consolidate: null

# Report metadata
report_metadata:
  phase: "7"
  description: >
    Deterministic candidate municipality/action generation.
    No site selection, no parcel claims, no cash-flow claims, no LLM narrative.
  experiment_stage: E0
