version: 1
purpose: "Deterministic Phase 13 cash-flow substrate assumptions."
scope:
  allowed_candidate_actions:
    - build
    - reorganize
    - consolidate
  forbidden_outputs:
    - "LLM proposal generation"
    - "reviewer agents"
    - "tree search"
    - "exact parcel or site selection"
    - "final hospital recommendations"

payback_status:
  target_payback_years:
    value: 20.0
    unit: years
    scenario_label: scenario_assumption
    rationale: "Workbook README identifies payback as a rough screening metric; this threshold is used only for deterministic status labeling."
  near_target_multiplier:
    value: 1.25
    unit: ratio
    scenario_label: scenario_assumption
    rationale: "Classifies projects within 25 percent of the target as near_target for QA reporting, not as recommendations."

action_scope_factors:
  build:
    value: 1.0
    scenario_label: scenario_assumption
    rationale: "New build uses the full prefecture-level workbook reference bed scale."
  reorganize:
    value: 0.25
    scenario_label: scenario_assumption
    rationale: "Reorganization is modeled as a partial capital scope; no exact site or parcel is selected."
  consolidate:
    value: 0.15
    scenario_label: scenario_assumption
    rationale: "Consolidation is modeled as a smaller transition capital scope; no closure recommendation is made."

sensitivity_scenarios:
  base:
    capex_multiplier: 1.0
    revenue_multiplier: 1.0
    expense_multiplier: 1.0
    scenario_label: scenario_assumption
    rationale: "Uses workbook-derived reference ratios without sensitivity adjustment."
  downside:
    capex_multiplier: 1.1
    revenue_multiplier: 0.95
    expense_multiplier: 1.05
    scenario_label: scenario_assumption
    rationale: "Tests higher capital cost, lower revenue, and higher operating expense."
  upside:
    capex_multiplier: 0.95
    revenue_multiplier: 1.05
    expense_multiplier: 0.98
    scenario_label: scenario_assumption
    rationale: "Tests lower capital cost, higher revenue, and lower operating expense."
  stress:
    capex_multiplier: 1.2
    revenue_multiplier: 0.9
    expense_multiplier: 1.1
    scenario_label: scenario_assumption
    rationale: "Tests a conservative adverse case for QA and comparison only."
