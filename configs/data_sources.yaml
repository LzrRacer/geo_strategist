version: 1
policy:
  phase: data_contracts_and_inspection
  no_mock_numeric_datasets: true
  no_fake_api_outputs: true
  numeric_claims_require_provenance: true
  assumptions_require_source_or_basis: true

stores:
  manual_real_world_inputs:
    root: ".data/manual"
    tracked_by_git: false
    description: "User-supplied real-world files that are local-only."
    expected_content:
      - "licensed spreadsheets"
      - "official CSV exports"
      - "manual notes with source URLs"
    canonical_files:
      hospital_cashflow_workbook: ".data/manual/hospital_cf_workbook/hospital_rough_cf_payback_model_tokyo_aichi_osaka_beds_updated.xlsx"
      population_workbooks_glob: ".data/manual/population_data/*.xlsx"

  api_raw_responses:
    root: ".data/api_raw"
    tracked_by_git: false
    description: "Unmodified raw API responses captured locally for reproducibility."
    expected_roots:
      yahoo: ".data/api_raw/yahoo"
      estat: ".data/api_raw/estat"
      reinfolib: ".data/api_raw/reinfolib"

  cached_retrieval:
    root: ".cache"
    tracked_by_git: false
    description: "Intermediate cache files produced by future retrieval code."
    expected_roots:
      inspection: ".cache/inspection"
      inventory: ".cache/inventory"
      normalization: ".cache/normalization"
      views: ".cache/views"
      review: ".cache/review"
      study_area: ".cache/study_area/tokyo_aichi_osaka"

  normalized_intermediate_outputs:
    root: ".data/interim/normalized"
    tracked_by_git: false
    description: "Derived deterministic normalized records with source-cell provenance."
    expected_roots:
      hospital_workbook: ".data/interim/normalized/hospital_workbook"
      population: ".data/interim/normalized/population"

  analysis_ready_views:
    root: ".data/interim/views"
    tracked_by_git: false
    description: "Derived source views for later modeling; not final analysis."
    expected_roots:
      hospital_facts: ".data/interim/views/hospital_workbook_facts.jsonl"
      population_long: ".data/interim/views/population_long.jsonl"
      population_rates_long: ".data/interim/views/population_rates_long.jsonl"

  study_area_views:
    root: ".data/interim/study_area/tokyo_aichi_osaka"
    tracked_by_git: false
    description: "Target-scoped population rows and geography keys for Tokyo, Aichi, and Osaka only."
    expected_roots:
      population_long: ".data/interim/study_area/tokyo_aichi_osaka/population_long.jsonl"
      population_rates_long: ".data/interim/study_area/tokyo_aichi_osaka/population_rates_long.jsonl"
      geography_keys: ".data/interim/study_area/tokyo_aichi_osaka/geography_keys.jsonl"
      geography_grain_records: ".data/interim/study_area/tokyo_aichi_osaka/geography_grain_records.jsonl"
      population_base: ".data/interim/study_area/tokyo_aichi_osaka/population_base.jsonl"
      population_base_municipality: ".data/interim/study_area/tokyo_aichi_osaka/population_base_municipality.jsonl"
      population_base_prefecture_total: ".data/interim/study_area/tokyo_aichi_osaka/population_base_prefecture_total.jsonl"
      population_base_age_normalized: ".data/interim/study_area/tokyo_aichi_osaka/population_base_age_normalized.jsonl"

  study_area_cache:
    root: ".cache/study_area/tokyo_aichi_osaka"
    tracked_by_git: false
    description: "Target-scope summaries, manifests, and geography QA issues for the current study area."
    expected_roots:
      manifest: ".cache/study_area/tokyo_aichi_osaka/study_area_manifest.json"
      summary: ".cache/study_area/tokyo_aichi_osaka/study_area_summary.md"
      scope_issues: ".cache/study_area/tokyo_aichi_osaka/study_area_scope_issues.jsonl"
      outside_scope_counts: ".cache/study_area/tokyo_aichi_osaka/outside_scope_counts.json"
      geography_qa: ".cache/study_area/tokyo_aichi_osaka/geography_qa.json"
      geography_issues: ".cache/study_area/tokyo_aichi_osaka/geography_issues.jsonl"
      geography_grain_manifest: ".cache/study_area/tokyo_aichi_osaka/geography_grain_manifest.json"
      geography_grain_summary: ".cache/study_area/tokyo_aichi_osaka/geography_grain_summary.md"
      geography_grain_issues: ".cache/study_area/tokyo_aichi_osaka/geography_grain_issues.jsonl"
      population_base_manifest: ".cache/study_area/tokyo_aichi_osaka/population_base_manifest.json"
      population_base_summary: ".cache/study_area/tokyo_aichi_osaka/population_base_summary.md"
      population_base_issues: ".cache/study_area/tokyo_aichi_osaka/population_base_issues.jsonl"
      population_base_report: ".cache/study_area/tokyo_aichi_osaka/population_base_report.json"
      population_base_coverage_matrix_json: ".cache/study_area/tokyo_aichi_osaka/population_base_coverage_matrix.json"
      population_base_coverage_matrix_csv: ".cache/study_area/tokyo_aichi_osaka/population_base_coverage_matrix.csv"
      population_base_coverage_issues: ".cache/study_area/tokyo_aichi_osaka/population_base_coverage_issues.jsonl"
      population_base_coverage_manifest: ".cache/study_area/tokyo_aichi_osaka/population_base_coverage_manifest.json"
      population_base_coverage_summary: ".cache/study_area/tokyo_aichi_osaka/population_base_coverage_summary.md"
      population_base_coverage_report_json: ".cache/study_area/tokyo_aichi_osaka/population_base_coverage_report.json"
      population_base_coverage_report_markdown: ".cache/study_area/tokyo_aichi_osaka/population_base_coverage_report.md"
      age_group_qa_manifest: ".cache/study_area/tokyo_aichi_osaka/age_group_qa_manifest.json"
      age_group_qa_summary: ".cache/study_area/tokyo_aichi_osaka/age_group_qa_summary.md"
      age_group_qa_issues: ".cache/study_area/tokyo_aichi_osaka/age_group_qa_issues.jsonl"
      age_group_coverage_report_json: ".cache/study_area/tokyo_aichi_osaka/age_group_coverage_report.json"
      age_group_coverage_report_markdown: ".cache/study_area/tokyo_aichi_osaka/age_group_coverage_report.md"

  analysis_qa_views:
    root: ".data/interim/qa"
    tracked_by_git: false
    description: "Deterministic QA keys used to validate population geography and units."
    expected_roots:
      population_geography_keys: ".data/interim/qa/population_geography_keys.jsonl"

  generated_run_outputs:
    root: ".runs"
    tracked_by_git: false
    description: "Run manifests, reports, traces, and generated artifacts."

  api_sources:
    reinfolib:
      name: "MLIT Real Estate Information Library (不動産情報ライブラリ)"
      url: "https://www.reinfolib.mlit.go.jp/ex-api/external/XIT001"
      auth_env_var: "REINFOLIB_API_KEY"
      auth_header: "Ocp-Apim-Subscription-Key"
      cache_root: ".data/api_raw/reinfolib"
      coverage: "Land transaction prices by prefecture and survey type"
      graceful_unavailable: true
      unavailable_behavior: "Emit source_credentials_unavailable warning; write empty records; mark all municipality land features unavailable."
    yahoo_local_search:
      name: "Yahoo Japan Local Search API"
      url: "https://map.yahooapis.jp/search/local/V1/localSearch"
      auth_env_var: "YAHOO_CLIENT_ID"
      auth_header_param: "appid"
      cache_root: ".data/api_raw/yahoo"
      coverage: "Healthcare facility listings by prefecture and category"
      graceful_unavailable: true
      unavailable_behavior: "Emit source_credentials_unavailable warning; write empty records; mark all municipality healthcare supply features unavailable."

legacy_fallbacks:
  manual_inputs:
    root: "data/manual"
    status: transitional
    tracked_by_git: false
    warning: "May be detected if .data/manual is missing, but should not be committed."

contracts:
  manual_inputs_must_include_source_notes: true
  api_raw_files_must_include_retrieval_metadata: true
  generated_outputs_must_reference_run_manifest: true
  release_artifacts_must_exclude_local_only_stores: true
  inspection_profiles_are_not_source_data: true
  normalized_outputs_are_not_final_analysis: true
  analysis_views_are_not_scores_or_proposals: true
  study_area_outputs_are_not_demand_scores: true
