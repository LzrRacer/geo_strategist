version: 5
study: geo_strategist_agentic_condition_track

# Canonical condition order. Model/provider values may be overridden through
# Cx_* environment variables; src/geo_strategist/experiments/condition_registry.py
# is the executable source of truth and mirrors this file.

branch_objectives:
  - elderly-demand
  - emergency-access
  - reorganization-feasibility
  - financial-risk
  - evidence-completeness

conditions:
  - id: C0
    report_slug: C00_deterministic_baseline
    label: "Deterministic Python baseline"
    provider: none
    model: null
    harness: deterministic_python
    algorithm: deterministic_baseline
    skills_unified: false
    branch_search: false

  - id: C1
    report_slug: C01_vanilla_gemini
    label: "Vanilla direct LLM baseline (Gemini)"
    provider: gemini
    model: gemini-3.5-flash            # must equal C9 for the strict comparison
    harness: direct_api
    algorithm: vanilla_llm
    skills_unified: false
    branch_search: false
    strict_pair: C9
    notes: "No tool use, no generated-code execution, single pass."

  - id: C2
    report_slug: C02_vanilla_codex_manual
    label: "Vanilla LLM baseline (Codex, gpt-5.5)"
    provider: codex
    model: gpt-5.5                     # must equal C6 for the strict comparison
    harness: codex
    algorithm: vanilla_llm
    skills_unified: false
    branch_search: false
    runner: manual_harness
    strict_pair: C6
    notes: "Manual harness; single pass, no tools, no Skills contract. Part of the C1-C4 vanilla-baseline comparison."
    manual_harness_prompt: outputs/condition_proposals/live/manual_harness/C02_vanilla_codex_prompt.md

  - id: C3
    report_slug: C03_vanilla_claude_code_manual
    label: "Vanilla LLM baseline (Claude Code, sonnet-5.0)"
    provider: claude_code
    model: sonnet-5.0                  # must equal C7 for the strict comparison
    harness: claude_code
    algorithm: vanilla_llm
    skills_unified: false
    branch_search: false
    runner: manual_harness
    strict_pair: C7
    notes: "Manual harness; single pass, no tools, no Skills contract. Part of the C1-C4 vanilla-baseline comparison."
    manual_harness_prompt: outputs/condition_proposals/live/manual_harness/C03_vanilla_claude_code_prompt.md

  - id: C4
    report_slug: C04_vanilla_deepseek
    label: "Vanilla direct LLM baseline (DeepSeek)"
    provider: opencode_go
    model: deepseek-v4-flash           # must equal C8/C10 for the strict comparison
    harness: direct_api
    algorithm: vanilla_llm
    skills_unified: false
    branch_search: false
    strict_trio: [C8, C10]
    notes: "No tool use, no generated-code execution, single pass. Part of the C1-C4 vanilla-baseline comparison."

  - id: C5
    report_slug: C05_skills_antigravity_manual
    label: "Skills-Antigravity"
    provider: antigravity
    model: gemini-3.5-pro
    harness: antigravity
    algorithm: skills_branch_search
    skills_unified: true
    branch_search: true
    runner: agentic_skills_harness
    instruction_mode: agents_md_skills
    skill_source: {codex: .agents/skills, claude_code: .claude/skills, opencode: .claude/skills}
    notes: "AGENTS.md + filesystem Skills harness, Skills-unified contract + branch search; CLI launched via `agy`. Part of the C5-C8 Skills-in-harness comparison; no vanilla counterpart on this provider/model."
    launcher_prompt: outputs/condition_proposals/live/manual_harness/C05_skills_antigravity_launcher.md

  - id: C6
    report_slug: C06_skills_codex_manual
    label: "Skills-Codex"
    provider: codex
    model: gpt-5.5                     # must equal C2 for the strict comparison
    harness: codex
    algorithm: skills_branch_search
    skills_unified: true
    branch_search: true
    runner: agentic_skills_harness
    instruction_mode: agents_md_skills
    skill_source: {codex: .agents/skills, claude_code: .claude/skills, opencode: .claude/skills}
    strict_pair: C2
    notes: "AGENTS.md + filesystem Skills harness, Skills-unified contract + branch search; CLI launched via `codex`. Part of the C5-C8 Skills-in-harness comparison."
    launcher_prompt: outputs/condition_proposals/live/manual_harness/C06_skills_codex_launcher.md

  - id: C7
    report_slug: C07_skills_claude_code_manual
    label: "Skills-Claude Code"
    provider: claude_code
    model: sonnet-5.0                  # must equal C3 for the strict comparison
    harness: claude_code
    algorithm: skills_branch_search
    skills_unified: true
    branch_search: true
    runner: agentic_skills_harness
    instruction_mode: agents_md_skills
    skill_source: {codex: .agents/skills, claude_code: .claude/skills, opencode: .claude/skills}
    strict_pair: C3
    notes: "AGENTS.md + filesystem Skills harness, Skills-unified contract + branch search; CLI launched via `claude`. Part of the C5-C8 Skills-in-harness comparison."
    launcher_prompt: outputs/condition_proposals/live/manual_harness/C07_skills_claude_code_launcher.md

  - id: C8
    report_slug: C08_skills_opencode_manual
    label: "Skills-OpenCode"
    provider: opencode_go
    model: deepseek-v4-flash          # must equal C4/C10 for the strict comparison
    harness: opencode
    algorithm: skills_branch_search
    skills_unified: true
    branch_search: true
    runner: agentic_skills_harness
    instruction_mode: agents_md_skills
    skill_source: {codex: .agents/skills, claude_code: .claude/skills, opencode: .claude/skills}
    strict_trio: [C4, C10]
    notes: "AGENTS.md + filesystem Skills harness, Skills-unified contract + branch search; CLI launched via `opencode`. Part of the C5-C8 Skills-in-harness comparison."
    launcher_prompt: outputs/condition_proposals/live/manual_harness/C08_skills_opencode_launcher.md

  - id: C9
    report_slug: C09_ai_scientist_gemini
    label: "Traditional AI Scientist-style Gemini"
    provider: gemini
    model: gemini-3.5-flash            # must equal C1 for the strict comparison
    harness: direct_api
    algorithm: ai_scientist_style
    skills_unified: false
    branch_search: true
    budgets: {num_drafts: 10, agent_steps: 40, variants_per_branch: 6, max_debug_depth: 4, concurrency: 4}
    strict_pair: C1
    algorithm_pair: C10

  - id: C10
    report_slug: C10_ai_scientist_deepseek
    label: "Traditional AI Scientist-style DeepSeek"
    provider: opencode_go
    model: deepseek-v4-flash          # must equal C4/C8 for the strict comparison
    harness: direct_api
    algorithm: ai_scientist_style_large_scale
    skills_unified: false
    branch_search: true
    budgets: {num_drafts: 10, agent_steps: 40, variants_per_branch: 6, max_debug_depth: 4, concurrency: 4}
    strict_trio: [C4, C8]
    algorithm_pair: C9

  - id: C11
    report_slug: C11_shinka_evolution
    label: "Multi-model Shinka-style evolution"
    provider: opencode_go
    harness: direct_api
    algorithm: multi_model_evolution
    optional: true
    branch_search: true
    model_roles:
      mutation: deepseek-v4-flash
      critique: deepseek-v4-pro
      code_repair: kimi-k2.7-code
      synthesis: qwen3.7-plus
      judge: qwen3.7-max
    budgets: {population_size: 40, generations: 3, elite_count: 8}
    call_share_limits: {pro_max: 0.15, judge_max: 0.03, flash_min: 0.70}

  - id: C12
    report_slug: C12_ab_mcts
    label: "AB-MCTS-style adaptive branching"
    provider: opencode_go
    harness: direct_api
    algorithm: adaptive_branching_mcts
    optional: true
    branch_search: true
    model_roles:
      expand: deepseek-v4-flash
      refine: deepseek-v4-pro
      code_repair: kimi-k2.7-code
      node_evaluation: qwen3.7-plus
      judge: qwen3.7-max

  - id: C13
    report_slug: C13_fugu_router
    label: "Fugu-style dynamic orchestrator"
    provider: opencode_go
    harness: direct_api
    algorithm: dynamic_multi_agent_orchestrator
    optional: true
    branch_search: true
    model_roles:
      router: qwen3.7-plus
      fast: deepseek-v4-flash
      pro: deepseek-v4-pro
      code: kimi-k2.7-code
      review: qwen3.7-plus
      judge: qwen3.7-max

judge:
  id: E13                                   # historical id; artifacts use descriptive names
  label: "Cross-condition proposal and agentic-process judge"
  report: reports/condition_comparison_report.md
  scores: condition_judge_scores.jsonl
  manifest: condition_judge_manifest.json
  dimensions: 18                            # includes qualitative_site_reasoning
  primary_provider: gemini
  primary_model: gemini-3.5-flash
  secondary_provider: openrouter          # optional; rate-limit tolerant
  secondary_model: qwen/qwen3-coder:free

live_agent_rules:
  require_live_agents: true
  disable_deterministic_fallback_for_comparison: true
  comparable_execution_modes: [live, live_manual_harness, deterministic_baseline]
  non_comparable_execution_modes:
    [deterministic_fallback, live_auth_failed, live_rate_limited,
     output_truncated, live_error, waiting_for_manual_harness]

common_requirements:
  require_real_sources: true
  prohibit_fabricated_concrete_facts: true
  require_provenance_or_unverified_grade: true
  require_due_diligence_footer: true
  prohibit_operationally_final_decisions: true
  require_run_manifest: true
