version: 1
phase: deterministic_population_geography_qa
policy:
  no_geocoding: true
  no_api_calls: true
  no_inference_of_missing_geography: true
  no_count_rate_conversion: true
  preserve_raw_labels: true

inputs:
  population_long: ".data/interim/views/population_long.jsonl"
  population_rates_long: ".data/interim/views/population_rates_long.jsonl"

outputs:
  population_geography_keys: ".data/interim/qa/population_geography_keys.jsonl"
  population_qa_manifest: ".cache/qa/population_geography_qa_manifest.json"
  population_qa_summary: ".cache/qa/population_geography_qa.md"
  population_geography_issues: ".cache/qa/population_geography_issues.jsonl"
