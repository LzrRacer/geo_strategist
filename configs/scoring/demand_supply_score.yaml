# Deterministic demand/supply score configuration for Phase 5.
# All weights and ceilings are documented assumptions. Do not change without
# updating the corresponding report and re-running score layer.

version: "1.0"

# Score directionality: higher value = more demand pressure / higher priority.
directionality:
  demand_pressure_score: higher_is_more_pressure
  population_aging_pressure_score: higher_is_more_pressure
  supply_gap_score: higher_is_higher_gap
  data_completeness_score: higher_is_more_complete
  overall_pre_candidate_priority_score: higher_is_higher_priority

# Normalization ceilings: values at or above the ceiling score 1.0.
# These are documented scenario assumptions based on national Japanese elderly
# population patterns. They are labeled as assumptions, not real data.
normalization_ceilings:
  # 65+ population share ceiling: 40% is above current national average (~29%
  # in 2023) but within the projected range for some municipalities by 2045.
  share_65_plus: 0.40

  # 65+ population percentage growth ceiling: 150% growth is an extreme upper
  # bound for high-growth elderly municipalities over the 2020-2050 window.
  population_65_plus_pct_change: 1.50

  # Adequate beds per 100k population: 200 is an approximate reference level
  # for acute care beds in comparable urban prefectures. Municipalities with
  # their prefecture's beds per 100k above this threshold score 0.
  beds_per_100k_adequate: 200.0

  # Phase 6 ceilings — enabled only when real source data is available.
  # Land price ceiling (JPY/m2): 1,000,000 JPY/m2 is approximately the upper
  # end of commercial land in central Tokyo. Municipalities at or above this
  # ceiling score 1.0 on land pressure.
  land_price_jpy_per_m2: 1000000.0

  # Healthcare supply density ceiling (facilities per 100k population):
  # 10 facilities per 100k is used as an "adequate" benchmark. Municipalities
  # at or above this level score 0.0 on healthcare supply gap.
  healthcare_supply_density_per_100k_adequate: 10.0

  # Hospital density (hospitals per 100k, for bed pressure proxy):
  # 5 hospitals per 100k is used as "adequate". Municipalities below this
  # score higher on bed supply pressure.
  hospitals_per_100k_adequate: 5.0

# Score weights for overall_pre_candidate_priority_score.
# Must sum to 1.0. These are documented scenario weights.
weights:
  demand_pressure_score: 0.35
  population_aging_pressure_score: 0.25
  supply_gap_score: 0.25
  data_completeness_score: 0.15
  # Phase 6 weights — used by enriched score layer only when real data available.
  land_score: 0.15
  healthcare_supply_score: 0.15
  bed_supply_pressure_score: 0.10

# What to do when a required score input is unavailable.
# Options: zero_score (treats unavailable as 0) or skip_component (excludes
# the component from the weighted average).
missing_data_policy: zero_score

# Tie-break policy for equal overall scores.
tie_break_policy: alphabetical_by_municipality

# Explicitly unavailable scores and their reasons.
unavailable_scores:
  land_score:
    available: false
    reason: >
      No validated real land-price artifact (e.g., MLIT land price survey data)
      is present in the current phase. Do not create a land score until Phase 6
      provides a committed real land-price input.
  cash_flow_score:
    available: false
    reason: >
      Site-specific cash-flow projection requires site selection and parcel data
      not yet available. The hospital workbook contains rough model assumptions
      per hospital but not per municipality. Cash-flow scoring deferred to
      Phase 8.
  bed_supply_pressure_score:
    available: false
    reason: >
      True bed supply pressure requires prefecture-level population aggregates
      to compute beds-per-100k against the correct denominator. Currently only
      municipality-level population and prefecture-level bed counts are joined,
      making this ratio approximate. Deferred to Phase 6.
