version: 1
description: >
  S1 source registry for the site-selection/investment-proposal pipeline
  (S1-S7, E14). Declares real data sources actually present in this repo and
  fail-closed stubs for categories that are not available in this
  environment (no internet access, no licensed parcel/zoning/hazard/transit
  datasets). Connectors never fetch from a live network endpoint and never
  fabricate a record count or evidence grade.

sources:
  - source_key: healthcare_facility_addresses
    category: existing_hospitals_and_clinics
    connector: healthcare_facility_connector
    status: connected
    path: .data/interim/study_area/tokyo_aichi_osaka/healthcare_supply_records.jsonl
    format: jsonl
    default_evidence_grade: verified_source
    description: >
      Geocoded existing facility name/address/coordinates, normalized from a
      Yahoo Local Search API pull already committed to the repo's data
      pipeline. Includes non-hospital categories (e.g. veterinary clinics);
      the connector tags facility_category so callers can filter.

  - source_key: hospital_financial_cost_model
    category: financial_and_cost_assumptions
    connector: financial_workbook_connector
    status: connected
    path: .data/manual/hospital_cf_workbook/hospital_rough_cf_payback_model_tokyo_aichi_osaka_beds_updated.xlsx
    format: xlsx
    sheets:
      hospital_master: hospital_master_68
      cf_payback_model: cf_payback_model_68
      bed_counts_official: bed_counts_official_68
      source_catalog: source_catalog
    default_evidence_grade: model_estimate
    description: >
      68-facility 救命救急センター (Tokyo/Aichi/Osaka) rough cash-flow and
      payback model: revenue, expenses, EBITDA, beds, land price per sqm,
      construction cost, land area, and payback years, each row carrying a
      data_basis flag ("施設別実績" = facility-level actuals,
      "モデル推計" = archetype/proxy-bed model estimate), a bed
      verification_status, and a source_url. This is the real basis for
      construction/land/opex proportionality assumptions; see model_note per
      row.
    beds_and_land_source_categories:
      - hospital_bed_counts_or_capacity_proxies
      - land_parcels_or_real_estate_records
      - land_price_rent_or_acquisition_cost_proxies
      - construction_cost_assumptions
      - reimbursement_or_revenue_assumptions
      - operating_cost_assumptions

  - source_key: population_age_structure
    category: population_and_age_structure
    connector: population_demand_connector
    status: connected
    path: .data/interim/study_area/tokyo_aichi_osaka/population_base_age_normalized.jsonl
    format: jsonl
    default_evidence_grade: verified_source
    description: >
      Municipality-level 2020 population by canonical age band (age_0_14,
      age_15_64, age_65_plus, age_75_plus, total), normalized from real
      prefecture population workbooks already committed to this repo's data
      pipeline, with full cell-level provenance.

  - source_key: competitor_supply_density
    category: competitor_supply_and_catchment_assumptions
    connector: healthcare_facility_connector
    status: connected
    derived: true
    default_evidence_grade: derived_from_verified_source
    description: >
      Nearby-facility counts and distances are computed deterministically
      from healthcare_facility_addresses (haversine distance), not a
      separate source. Grade is derived_from_verified_source because it is
      a deterministic calculation over verified_source input records.

  - source_key: land_parcel_registry
    category: land_parcels_or_candidate_real_estate_records
    connector: stub_connector
    status: not_configured
    description: >
      No licensed parcel/lot-number (地番) registry is configured in this
      environment. Candidate sites cannot claim a parcel_id; they must set
      parcel_id_not_available_reason instead.

  - source_key: zoning_land_use
    category: zoning_or_land_use_constraints
    connector: stub_connector
    status: not_configured
    description: No zoning/land-use dataset is configured in this environment.

  - source_key: hazard_disaster_risk
    category: hazard_or_disaster_risk_constraints
    connector: stub_connector
    status: not_configured
    description: No hazard/disaster-risk dataset is configured in this environment.

  - source_key: transport_accessibility
    category: transport_accessibility
    connector: stub_connector
    status: not_configured
    description: >
      No transit/travel-time dataset is configured in this environment.
      nearest_transport_access on candidate sites stays not_available until
      one is added.

  - source_key: geocoding_provenance
    category: address_latitude_longitude_and_geocoding_provenance
    connector: healthcare_facility_connector
    status: connected
    derived: true
    default_evidence_grade: verified_source
    description: >
      Address/latitude/longitude provenance is carried on each
      healthcare_facility_addresses record (source_url, source_type,
      retrieved_at); there is no separate geocoding source in this
      environment.

common_requirements:
  no_live_network_calls: true
  fail_closed_when_not_configured: true
  never_fabricate_record_counts: true
  never_fabricate_evidence_grades: true
