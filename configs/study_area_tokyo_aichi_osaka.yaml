version: 1
study_area:
  id: tokyo_aichi_osaka
  name: "Tokyo, Aichi, and Osaka hospital strategy study area"
  target_prefectures:
    - 東京都
    - 愛知県
    - 大阪府
  aliases:
    東京都:
      - Tokyo
      - Tokyo-to
      - 東京都
    愛知県:
      - Aichi
      - Aichi-ken
      - 愛知県
    大阪府:
      - Osaka
      - Osaka-fu
      - 大阪府
  scope_policy:
    target_prefecture_rows: in_scope
    other_prefecture_rows: outside_scope
    missing_or_unknown_prefecture_rows: scope_unknown
    unknown_prefecture_aliases:
      - unknown
      - Unknown
      - n/a
      - N/A
      - 不明
      - 未確認
    non_target_prefectures_are_errors: false
    missing_municipality_in_target_scope_is_issue: true
    invent_municipalities: false
  allowed_value_kinds:
    - count
    - rate

inputs:
  population_long: ".data/interim/views/population_long.jsonl"
  population_rates_long: ".data/interim/views/population_rates_long.jsonl"
  population_geography_keys: ".data/interim/qa/population_geography_keys.jsonl"
  population_geography_issues: ".cache/qa/population_geography_issues.jsonl"
  population_geography_qa_manifest: ".cache/qa/population_geography_qa_manifest.json"

